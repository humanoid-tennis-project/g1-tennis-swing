<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>打撃タイミングの確認</title><style>
body{font:16px system-ui;background:#f4f5f7;color:#202b36;margin:0}main{max-width:1160px;margin:24px auto;padding:16px}h1{font-size:24px}video{width:100%;max-height:62vh;background:#111;border-radius:8px}button,select,input,textarea{font:inherit;padding:9px;margin:4px;border:1px solid #bac3cb;border-radius:6px}button{cursor:pointer;background:white}button.primary{background:#11665b;color:white}section{background:white;padding:14px;border-radius:10px;margin:12px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.muted{color:#536577;font-size:14px}#msg{font-weight:bold}#seek{flex:1;min-width:220px}#clips{max-width:700px}textarea{width:90%;height:45px}li{margin:8px}a{color:#11665b}
</style><main><h1>打撃タイミングを記録</h1><p class="muted">元映像と推定骨格の比較動画を見て、打つ瞬間を記録します。1区間に複数打撃があれば全て追加してください。骨格・選択境界は変更しません。</p>
<section><div id="counts"></div><div class="row"><select id="type"><option value="">全打種</option><option>forehand</option><option>backhand</option><option>volley</option><option>overhead</option><option>serve</option></select><select id="status"><option value="">全進捗</option><option value="pending">未確認</option><option value="confirmed">確認済み</option><option value="uncertain">要再確認</option><option value="no_hit">打撃なし</option></select><select id="clips"></select><button id="prev">前へ</button><button id="next">次へ</button></div><div id="label" class="muted"></div></section>
<video id="video" controls preload="metadata"></video><section><div class="row"><button id="back">← 1フレーム</button><button id="play">再生 / 停止</button><button id="forward">1フレーム →</button><select id="speed"><option value="0.25">0.25倍</option><option value="0.5" selected>0.5倍</option><option value="1">1倍</option></select><input id="seek" type="range" step="1"><span id="clock"></span></div>
<div class="row"><label>判断根拠 <select id="evidence"><option value="visible_contact">映像で接触を確認</option><option value="audio_timing">打球音を目安に確認</option><option value="estimated_swing">接触は見えずスイングから推定</option></select></label><label>不確かさ ±<input id="uncertainty" type="number" min="0" max="15" value="1" style="width:52px">フレーム</label><button id="add" class="primary">このフレームを追加（I）</button></div>
<p class="muted">← →でコマ送り、Spaceで再生・停止、Iで追加。映像は30Hzの既存時刻基準です。音や推定によるラベルを実測接触とは扱いません。</p><ol id="events"></ol><label>記録者 <select id="reviewer"><option value="user">作成者本人</option><option value="codex">Codexの目視</option></select></label><textarea id="note" placeholder="必要ならメモ"></textarea><div class="row"><button id="confirm" class="primary">確認済みとして保存</button><button id="hold">要再確認で保存</button><button id="none">打撃なしで保存</button><button id="pending">未確認へ戻す</button><a href="/api/export" target="_blank">全記録JSON</a></div><div id="msg" role="status"></div></section></main>
<script>
const $=id=>document.getElementById(id),v=$('video');let all=[],visible=[],row=null,events=[],dirty=false;
const names={visible_contact:'映像で接触',audio_timing:'打球音',estimated_swing:'スイング推定'};
function message(t){$('msg').textContent=t}
function frame(){return Math.max(row.source_start,Math.min(row.source_end-1,row.source_start+Math.round((v.currentTime-row.media_start)*30)))}
function seek(f){v.pause();v.currentTime=row.media_start+(Math.max(row.source_start,Math.min(row.source_end-1,f))-row.source_start)/30;update()}
function update(){if(!row)return;let f=frame();$('seek').value=f;$('clock').textContent=`区間 ${((f-row.source_start)/30).toFixed(3)}秒 / 元フレーム ${f}`;$('add').disabled=v.readyState<2||v.currentTime<row.media_start-.001||v.currentTime>=row.media_end;if(v.currentTime>row.media_end&&!v.paused){v.pause();seek(row.source_end-1)}}
function renderEvents(){let list=$('events');list.replaceChildren();events.forEach((e,i)=>{let li=document.createElement('li'),b=document.createElement('button'),d=document.createElement('button');b.textContent=`${((e.source_frame-row.source_start)/30).toFixed(3)}秒 · 元${e.source_frame} · ${names[e.evidence]} ±${e.uncertainty_source_frames}`;b.onclick=()=>seek(e.source_frame);d.textContent='削除';d.onclick=()=>{events.splice(i,1);dirty=true;renderEvents();message('未保存の変更があります')};li.append(b,d);list.append(li)})}
function load(key){if(dirty&&!confirm('未保存の変更を破棄しますか？')){$('clips').value=row.id;return}row=all.find(r=>r.id===key);events=structuredClone(row.annotation.events);$('note').value=row.annotation.note||'';$('reviewer').value=row.annotation.reviewer||'user';dirty=false;localStorage.setItem('impact-last',key);location.hash=key;$('label').textContent=`${row.type} · ${row.recording} · ${key} · ${row.annotation.status}`;$('seek').min=row.source_start;$('seek').max=row.source_end-1;v.src='/video?id='+encodeURIComponent(key);v.onloadedmetadata=()=>{v.playbackRate=+$('speed').value;seek(row.source_start)};renderEvents();message(row.annotation.revision?'保存済みの記録を読み込みました':'まだ打撃時刻は記録されていません')}
function filter(preferred){visible=all.filter(r=>(!$('type').value||r.type===$('type').value)&&(!$('status').value||r.annotation.status===$('status').value));$('clips').replaceChildren(...visible.map(r=>{let o=document.createElement('option');o.value=r.id;o.textContent=`${r.annotation.status==='pending'?'○':'✓'} ${r.type} · ${r.id}`;return o}));if(visible.length){let key=visible.some(r=>r.id===preferred)?preferred:visible[0].id;$('clips').value=key;load(key)}else message('この条件の区間はありません')}
let saving=false;
async function save(status){if(saving)return;if(status==='no_hit'&&events.length&&!confirm('追加した打撃を外して「打撃なし」にしますか？'))return;let target=row,payload={id:target.id,expected_revision:target.annotation.revision,status,events:status==='no_hit'?[]:structuredClone(events),note:$('note').value,reviewer:$('reviewer').value};let controls=[...document.querySelectorAll('button,select,textarea,input')].map(e=>[e,e.disabled]);saving=true;controls.forEach(([e])=>e.disabled=true);message('保存中…');try{let response=await fetch('/api/annotation',{method:'POST',headers:{'Content-Type':'application/json','X-Impact-Editor':'local'},body:JSON.stringify(payload)}),a=await response.json();if(!response.ok)throw Error(a.error);target.annotation=a;if(row===target){events=structuredClone(a.events);dirty=false;renderEvents();$('label').textContent=`${row.type} · ${row.recording} · ${row.id} · ${a.status}`}message('保存しました（履歴を保持）');counts()}catch(e){message('保存できません: '+e.message)}finally{saving=false;controls.forEach(([e,disabled])=>e.disabled=disabled)}}
function counts(){let n=s=>all.filter(r=>r.annotation.status===s).length;$('counts').textContent=`全${all.length}区間 / 未確認${n('pending')} / 確認済み${n('confirmed')} / 要再確認${n('uncertain')} / 打撃なし${n('no_hit')}`}
$('add').onclick=()=>{if(!row)return;let f=frame();if(events.some(e=>e.source_frame===f))return message('このフレームは追加済みです');events.push({source_frame:f,evidence:$('evidence').value,uncertainty_source_frames:+$('uncertainty').value});events.sort((a,b)=>a.source_frame-b.source_frame);dirty=true;renderEvents();message('追加しました。確認済み、または要再確認で保存してください')};$('back').onclick=()=>seek(frame()-1);$('forward').onclick=()=>seek(frame()+1);$('play').onclick=()=>{if(v.paused){if(v.currentTime>=row.media_end-.04)seek(row.source_start);v.play()}else v.pause()};$('seek').oninput=()=>seek(+$('seek').value);$('speed').onchange=()=>v.playbackRate=+$('speed').value;v.ontimeupdate=update;v.onseeked=update;$('note').oninput=()=>dirty=true;
$('confirm').onclick=()=>save('confirmed');$('hold').onclick=()=>save('uncertain');$('none').onclick=()=>save('no_hit');$('pending').onclick=()=>save('pending');$('clips').onchange=()=>load($('clips').value);$('type').onchange=()=>filter(row?.id);$('status').onchange=()=>filter(row?.id);for(let [id,delta]of [['prev',-1],['next',1]])$(id).onclick=()=>{let i=visible.findIndex(r=>r.id===row.id)+delta;if(i>=0&&i<visible.length){$('clips').value=visible[i].id;load(visible[i].id)}};
document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;let a={ArrowLeft:'back',ArrowRight:'forward',' ':'play',i:'add',I:'add'}[e.key];if(a){e.preventDefault();$(a).click()}};window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
fetch('/api/index').then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);all=d.clips;counts();filter(location.hash.slice(1)||localStorage.getItem('impact-last'))}).catch(e=>message(e.message));
</script></html>
